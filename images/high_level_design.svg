<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%" style="background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-gh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad-aws" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="grad-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="grad-bi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f97316" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold" letter-spacing="1">HIGH LEVEL SYSTEM DESIGN: RETAIL SALES LAKEHOUSE</text>
  <text x="550" y="72" text-anchor="middle" fill="#94a3b8" font-size="14">Serverless Medallion Architecture on AWS Cloud, GitHub Actions CI/CD &amp; Power BI</text>

  <!-- SECTION 1: GIT & CI/CD -->
  <rect x="30" y="110" width="210" height="490" rx="14" fill="url(#grad-gh)" stroke="#475569" stroke-width="1.5" filter="url(#drop-shadow)"/>
  <rect x="45" y="125" width="180" height="35" rx="6" fill="#0f172a" />
  <text x="135" y="148" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">1. CI/CD &amp; GITOPS</text>
  
  <rect x="45" y="180" width="180" height="95" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1" filter="url(#drop-shadow)"/>
  <text x="135" y="210" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="bold">GitHub Repository</text>
  <text x="135" y="230" text-anchor="middle" fill="#94a3b8" font-size="11">- PySpark ETL Scripts</text>
  <text x="135" y="248" text-anchor="middle" fill="#94a3b8" font-size="11">- SQL DDLs / Schema</text>
  <text x="135" y="265" text-anchor="middle" fill="#94a3b8" font-size="11">- Source CSV Datasets</text>

  <path d="M 135 275 L 135 320" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="145" y="302" fill="#38bdf8" font-size="10" font-weight="bold">git push</text>

  <rect x="45" y="330" width="180" height="125" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1" filter="url(#drop-shadow)"/>
  <text x="135" y="358" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="bold">GitHub Actions</text>
  <text x="135" y="378" text-anchor="middle" fill="#86efac" font-size="11">Runner (Free Tier)</text>
  <text x="135" y="400" text-anchor="middle" fill="#cbd5e1" font-size="10">• Lint &amp; Unit Tests</text>
  <text x="135" y="418" text-anchor="middle" fill="#cbd5e1" font-size="10">• AWS OIDC Auth (IAM)</text>
  <text x="135" y="436" text-anchor="middle" fill="#cbd5e1" font-size="10">• Deploy &amp; Run ETL</text>

  <rect x="45" y="480" width="180" height="95" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="135" y="508" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">AWS IAM (OIDC)</text>
  <text x="135" y="530" text-anchor="middle" fill="#94a3b8" font-size="10">Zero Static Keys</text>
  <text x="135" y="550" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="bold">100% Free Forever</text>

  <!-- Connect CI/CD to AWS -->
  <path d="M 225 390 L 285 390" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="255" y="380" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">Triggers</text>

  <!-- SECTION 2: AWS CLOUD LAKEHOUSE -->
  <rect x="295" y="110" width="520" height="490" rx="14" fill="url(#grad-aws)" stroke="#ff9900" stroke-width="1.5" filter="url(#drop-shadow)"/>
  <rect x="310" y="125" width="490" height="35" rx="6" fill="#0f172a" />
  <text x="555" y="148" text-anchor="middle" fill="#ff9900" font-size="14" font-weight="bold">2. AWS DATA LAKEHOUSE (MEDALLION PATTERN)</text>

  <!-- S3 Buckets / Layers -->
  <!-- BRONZE -->
  <rect x="315" y="180" width="145" height="200" rx="10" fill="url(#grad-bronze)" stroke="#d97706" stroke-width="1.5" filter="url(#drop-shadow)"/>
  <text x="387" y="208" text-anchor="middle" fill="#fef3c7" font-size="13" font-weight="bold">BRONZE LAYER</text>
  <text x="387" y="226" text-anchor="middle" fill="#fde68a" font-size="10">(Raw Storage / S3)</text>
  <line x1="325" y1="236" x2="450" y2="236" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="387" y="256" text-anchor="middle" fill="#ffffff" font-size="10">• Customers.csv</text>
  <text x="387" y="276" text-anchor="middle" fill="#ffffff" font-size="10">• Products.csv</text>
  <text x="387" y="296" text-anchor="middle" fill="#ffffff" font-size="10">• Sales_Returns.csv</text>
  <text x="387" y="316" text-anchor="middle" fill="#ffffff" font-size="10">• Payments.csv</text>
  <rect x="327" y="335" width="120" height="30" rx="5" fill="#451a03" />
  <text x="387" y="354" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="bold">Original Immutability</text>

  <!-- Processing Arrow 1 -->
  <path d="M 460 280 L 490 280" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <!-- SILVER -->
  <rect x="495" y="180" width="145" height="200" rx="10" fill="url(#grad-silver)" stroke="#94a3b8" stroke-width="1.5" filter="url(#drop-shadow)"/>
  <text x="567" y="208" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">SILVER LAYER</text>
  <text x="567" y="226" text-anchor="middle" fill="#cbd5e1" font-size="10">(Cleansed / Parquet)</text>
  <line x1="505" y1="236" x2="630" y2="236" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="567" y="256" text-anchor="middle" fill="#ffffff" font-size="10">✓ Deduplicated Data</text>
  <text x="567" y="276" text-anchor="middle" fill="#ffffff" font-size="10">✓ Validated Phone/Email</text>
  <text x="567" y="296" text-anchor="middle" fill="#ffffff" font-size="10">✓ Valid SKU Formats</text>
  <text x="567" y="316" text-anchor="middle" fill="#ffffff" font-size="10">✓ Handled Nulls &amp; Keys</text>
  <rect x="507" y="335" width="120" height="30" rx="5" fill="#0f172a" />
  <text x="567" y="354" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="bold">Snappy Parquet</text>

  <!-- Processing Arrow 2 -->
  <path d="M 640 280 L 665 280" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <!-- GOLD -->
  <rect x="670" y="180" width="135" height="200" rx="10" fill="url(#grad-gold)" stroke="#fef08a" stroke-width="1.5" filter="url(#drop-shadow)"/>
  <text x="737" y="208" text-anchor="middle" fill="#422006" font-size="13" font-weight="bold">GOLD LAYER</text>
  <text x="737" y="226" text-anchor="middle" fill="#713f12" font-size="10">(Curated Data Marts)</text>
  <line x1="680" y1="236" x2="795" y2="236" stroke="#854d0e" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="737" y="256" text-anchor="middle" fill="#451a03" font-size="9" font-weight="bold">★ Top 5 Orders/Returns</text>
  <text x="737" y="276" text-anchor="middle" fill="#451a03" font-size="9" font-weight="bold">★ Region Customer QoQ</text>
  <text x="737" y="296" text-anchor="middle" fill="#451a03" font-size="9" font-weight="bold">★ Product Sales/Margin</text>
  <text x="737" y="316" text-anchor="middle" fill="#451a03" font-size="9" font-weight="bold">★ Digital Payment %</text>
  <text x="737" y="334" text-anchor="middle" fill="#451a03" font-size="9" font-weight="bold">★ Sales Growth QoQ</text>

  <!-- Data Engine / Glue / Lambda -->
  <rect x="315" y="410" width="490" height="75" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="560" y="435" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">Compute Engine: AWS Glue (PySpark) or GitHub Action Runner</text>
  <text x="560" y="456" text-anchor="middle" fill="#94a3b8" font-size="11">Executes Data Quality Rules, Joins, Dimensional Aggregations &amp; Schema Registry</text>
  <text x="560" y="473" text-anchor="middle" fill="#4ade80" font-size="10">AWS Free Tier Optimized (Glue Catalog is Free, Athena Free 1TB/mo)</text>

  <!-- Athena & Glue Catalog -->
  <rect x="315" y="505" width="490" height="75" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="560" y="530" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="bold">Serving Layer: AWS Glue Data Catalog &amp; Amazon Athena</text>
  <text x="560" y="550" text-anchor="middle" fill="#94a3b8" font-size="11">Serverless Presto/Trino SQL Engine directly reads Gold Parquet tables in S3</text>
  <text x="560" y="568" text-anchor="middle" fill="#e2e8f0" font-size="10">Zero Infrastructure Setup • Sub-second Query Response • Pay-per-query (bash on Free Tier)</text>

  <!-- Connect AWS to Power BI -->
  <path d="M 815 390 L 860 390" fill="none" stroke="#facc15" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="838" y="378" text-anchor="middle" fill="#facc15" font-size="10" font-weight="bold">ODBC</text>

  <!-- SECTION 3: POWER BI DASHBOARD -->
  <rect x="870" y="110" width="200" height="490" rx="14" fill="url(#grad-gh)" stroke="#eab308" stroke-width="1.5" filter="url(#drop-shadow)"/>
  <rect x="885" y="125" width="170" height="35" rx="6" fill="#0f172a" />
  <text x="970" y="148" text-anchor="middle" fill="#facc15" font-size="14" font-weight="bold">3. POWER BI</text>

  <rect x="885" y="180" width="170" height="80" rx="8" fill="#1e293b" stroke="#ca8a04" stroke-width="1"/>
  <text x="970" y="206" text-anchor="middle" fill="#fef08a" font-size="12" font-weight="bold">Connection Layer</text>
  <text x="970" y="226" text-anchor="middle" fill="#94a3b8" font-size="10">Amazon Athena Connector</text>
  <text x="970" y="244" text-anchor="middle" fill="#38bdf8" font-size="10">DirectQuery / Auto-Import</text>

  <rect x="885" y="280" width="170" height="295" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1"/>
  <text x="970" y="305" text-anchor="middle" fill="#fef08a" font-size="12" font-weight="bold">Executive KPI Views</text>
  <line x1="895" y1="315" x2="1045" y2="315" stroke="#475569" stroke-width="1"/>

  <rect x="895" y="325" width="150" height="38" rx="5" fill="#0f172a"/>
  <text x="970" y="342" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="bold">Top 5 Orders vs Returns</text>
  <text x="970" y="356" text-anchor="middle" fill="#94a3b8" font-size="8">Customer &amp; Product Bar Chart</text>

  <rect x="895" y="372" width="150" height="38" rx="5" fill="#0f172a"/>
  <text x="970" y="389" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="bold">Region Customer QoQ</text>
  <text x="970" y="403" text-anchor="middle" fill="#94a3b8" font-size="8">Choropleth Map &amp; Line Chart</text>

  <rect x="895" y="419" width="150" height="38" rx="5" fill="#0f172a"/>
  <text x="970" y="436" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="bold">Product Sales vs Margin</text>
  <text x="970" y="450" text-anchor="middle" fill="#94a3b8" font-size="8">Scatter Plot &amp; Quadrant Matrix</text>

  <rect x="895" y="466" width="150" height="38" rx="5" fill="#0f172a"/>
  <text x="970" y="483" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="bold">Digital Payment %</text>
  <text x="970" y="497" text-anchor="middle" fill="#94a3b8" font-size="8">100% Stacked Area &amp; Donut</text>

  <rect x="895" y="513" width="150" height="38" rx="5" fill="#0f172a"/>
  <text x="970" y="530" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="bold">Sales Growth QoQ</text>
  <text x="970" y="544" text-anchor="middle" fill="#94a3b8" font-size="8">Waterfall / Trend Analysis</text>

</svg>