<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="p-step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="p-bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="p-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="p-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="p-bi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold" letter-spacing="1">END-TO-END DATA PIPELINE ARCHITECTURE (CI/CD TO BI)</text>
  <text x="600" y="72" text-anchor="middle" fill="#94a3b8" font-size="14">Automated Event-Driven Pipeline: Code Commit ➔ Data Cleansing ➔ Curated KPIs ➔ Athena ➔ Power BI</text>

  <!-- STEP 1: CODE TRIGGER & VALIDATION -->
  <rect x="30" y="110" width="200" height="520" rx="12" fill="url(#p-step1)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="45" y="125" width="170" height="32" rx="6" fill="#0369a1" />
  <text x="130" y="146" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">STAGE 1: TRIGGER &amp; CI/CD</text>

  <rect x="45" y="175" width="170" height="90" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="130" y="200" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Developer Git Commit</text>
  <text x="130" y="222" text-anchor="middle" fill="#38bdf8" font-size="10"></text>
  <text x="130" y="242" text-anchor="middle" fill="#94a3b8" font-size="9">Triggers GitHub Actions</text>

  <rect x="45" y="280" width="170" height="120" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="130" y="305" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">GHA Runner Checks</text>
  <text x="130" y="330" text-anchor="middle" fill="#4ade80" font-size="10">✓ Syntax &amp; PyLint Pass</text>
  <text x="130" y="350" text-anchor="middle" fill="#4ade80" font-size="10">✓ Schema Validation</text>
  <text x="130" y="370" text-anchor="middle" fill="#4ade80" font-size="10">✓ IAM OIDC Role Assume</text>

  <rect x="45" y="415" width="170" height="195" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="130" y="440" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">ETL Dispatcher</text>
  <text x="130" y="465" text-anchor="middle" fill="#94a3b8" font-size="10">Uploads clean scripts to:</text>
  <text x="130" y="485" text-anchor="middle" fill="#f59e0b" font-size="9"></text>
  <line x1="55" y1="505" x2="205" y2="505" stroke="#334155" stroke-width="1"/>
  <text x="130" y="530" text-anchor="middle" fill="#94a3b8" font-size="10">Invokes Data Pipeline</text>
  <text x="130" y="550" text-anchor="middle" fill="#38bdf8" font-size="10">Runner / Glue Job</text>
  <text x="130" y="575" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">Zero Cost on Free Tier</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 230 370 L 255 370" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flow-arrow)"/>

  <!-- STEP 2: BRONZE INGESTION -->
  <rect x="260" y="110" width="210" height="520" rx="12" fill="url(#p-bronze)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="275" y="125" width="180" height="32" rx="6" fill="#78350f" />
  <text x="365" y="146" text-anchor="middle" fill="#fef3c7" font-size="12" font-weight="bold">STAGE 2: BRONZE (RAW)</text>

  <rect x="275" y="175" width="180" height="215" rx="8" fill="#451a03" stroke="#b45309" stroke-width="1"/>
  <text x="365" y="202" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">Landing S3 Bucket</text>
  <text x="365" y="220" text-anchor="middle" fill="#fde68a" font-size="9"></text>
  <line x1="285" y1="232" x2="445" y2="232" stroke="#78350f" stroke-width="1"/>
  <text x="295" y="255" fill="#ffffff" font-size="10" font-weight="bold">1. Customer CSV:</text>
  <text x="305" y="270" fill="#fef3c7" font-size="9">ID, Name, Email, Region</text>
  <text x="295" y="295" fill="#ffffff" font-size="10" font-weight="bold">2. Product CSV:</text>
  <text x="305" y="310" fill="#fef3c7" font-size="9">SKU, Cost, Selling Price</text>
  <text x="295" y="335" fill="#ffffff" font-size="10" font-weight="bold">3. Sales &amp; Returns CSV:</text>
  <text x="305" y="350" fill="#fef3c7" font-size="9">Order ID, Date, Mode, Qty</text>
  <text x="295" y="375" fill="#ffffff" font-size="10" font-weight="bold">4. Payments CSV:</text>
  <text x="305" y="385" fill="#fef3c7" font-size="9">Payment ID, Type, Amount</text>

  <rect x="275" y="405" width="180" height="205" rx="8" fill="#451a03" stroke="#b45309" stroke-width="1"/>
  <text x="365" y="432" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">Ingestion Characteristics</text>
  <line x1="285" y1="444" x2="445" y2="444" stroke="#78350f" stroke-width="1"/>
  <text x="365" y="470" text-anchor="middle" fill="#ffffff" font-size="10">• Raw Immutable Format</text>
  <text x="365" y="495" text-anchor="middle" fill="#ffffff" font-size="10">• Ingestion Timestamping</text>
  <text x="365" y="520" text-anchor="middle" fill="#ffffff" font-size="10">• Zero Data Loss Guarantee</text>
  <text x="365" y="550" text-anchor="middle" fill="#ffffff" font-size="10">• S3 Object Versioning ON</text>
  <text x="365" y="580" text-anchor="middle" fill="#fde68a" font-size="9">Ready for Cleansing</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 470 370 L 495 370" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flow-arrow)"/>

  <!-- STEP 3: SILVER CLEANSING -->
  <rect x="500" y="110" width="210" height="520" rx="12" fill="url(#p-silver)" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="515" y="125" width="180" height="32" rx="6" fill="#334155" />
  <text x="605" y="146" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">STAGE 3: SILVER (CLEANSED)</text>

  <rect x="515" y="175" width="180" height="435" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="605" y="202" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">Data Cleansing Engine</text>
  <text x="605" y="220" text-anchor="middle" fill="#94a3b8" font-size="9"></text>
  <line x1="525" y1="232" x2="685" y2="232" stroke="#334155" stroke-width="1"/>

  <text x="530" y="255" fill="#38bdf8" font-size="10" font-weight="bold">Customer Cleansing:</text>
  <text x="535" y="272" fill="#e2e8f0" font-size="9">• Deduplicate by ID &amp; Email</text>
  <text x="535" y="288" fill="#e2e8f0" font-size="9">• Regex validate Phone/Email</text>

  <text x="530" y="315" fill="#38bdf8" font-size="10" font-weight="bold">Product Cleansing:</text>
  <text x="535" y="332" fill="#e2e8f0" font-size="9">• Verify SKU string format</text>
  <text x="535" y="348" fill="#e2e8f0" font-size="9">• Check Price &gt; Cost &gt; 0</text>

  <text x="530" y="375" fill="#38bdf8" font-size="10" font-weight="bold">Sales Cleansing:</text>
  <text x="535" y="392" fill="#e2e8f0" font-size="9">• Drop rows with NULL keys</text>
  <text x="535" y="408" fill="#e2e8f0" font-size="9">• Parse Year &amp; Quarter</text>
  <text x="535" y="424" fill="#e2e8f0" font-size="9">• Flag Returns vs Orders</text>

  <text x="530" y="450" fill="#38bdf8" font-size="10" font-weight="bold">Payments Cleansing:</text>
  <text x="535" y="467" fill="#e2e8f0" font-size="9">• Tag Digital vs Cash</text>
  <text x="535" y="483" fill="#e2e8f0" font-size="9">• Reconcile refunds</text>

  <rect x="525" y="510" width="160" height="80" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
  <text x="605" y="535" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="bold">Silver Output Format</text>
  <text x="605" y="555" text-anchor="middle" fill="#f8fafc" font-size="10">Snappy-Compressed Parquet</text>
  <text x="605" y="575" text-anchor="middle" fill="#94a3b8" font-size="9">80% Storage &amp; Scan Savings</text>

  <!-- Arrow 3 to 4 -->
  <path d="M 710 370 L 735 370" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flow-arrow)"/>

  <!-- STEP 4: GOLD CURATION & ATHENA -->
  <rect x="740" y="110" width="215" height="520" rx="12" fill="url(#p-gold)" stroke="#eab308" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="755" y="125" width="185" height="32" rx="6" fill="#854d0e" />
  <text x="847" y="146" text-anchor="middle" fill="#fef08a" font-size="12" font-weight="bold">STAGE 4: GOLD (5 KPIS)</text>

  <rect x="755" y="175" width="185" height="270" rx="8" fill="#422006" stroke="#a16207" stroke-width="1"/>
  <text x="847" y="200" text-anchor="middle" fill="#fde047" font-size="12" font-weight="bold">KPI Aggregation Marts</text>
  <text x="847" y="218" text-anchor="middle" fill="#fef9c3" font-size="9"></text>
  <line x1="765" y1="228" x2="930" y2="228" stroke="#854d0e" stroke-width="1"/>

  <text x="765" y="248" fill="#ffffff" font-size="9.5" font-weight="bold">1. Top 5 Orders vs Returns</text>
  <text x="775" y="263" fill="#fef08a" font-size="8.5">Rank by Customer &amp; SKU</text>

  <text x="765" y="285" fill="#ffffff" font-size="9.5" font-weight="bold">2. Region Customer Base</text>
  <text x="775" y="300" fill="#fef08a" font-size="8.5">Customer QoQ Growth %</text>

  <text x="765" y="322" fill="#ffffff" font-size="9.5" font-weight="bold">3. Product Sales vs Margin</text>
  <text x="775" y="337" fill="#fef08a" font-size="8.5">Revenue, Profit &amp; Margin %</text>

  <text x="765" y="359" fill="#ffffff" font-size="9.5" font-weight="bold">4. Digital Payment %</text>
  <text x="775" y="374" fill="#fef08a" font-size="8.5">(Digital / Total) * 100</text>

  <text x="765" y="396" fill="#ffffff" font-size="9.5" font-weight="bold">5. Sales Growth QoQ</text>
  <text x="775" y="411" fill="#fef08a" font-size="8.5">Current vs Prev Qtr Delta %</text>

  <!-- Athena Box -->
  <rect x="755" y="460" width="185" height="150" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="847" y="488" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="bold">Amazon Athena SQL</text>
  <text x="847" y="508" text-anchor="middle" fill="#94a3b8" font-size="10">AWS Glue Data Catalog</text>
  <line x1="765" y1="518" x2="930" y2="518" stroke="#475569" stroke-width="1"/>
  <text x="847" y="540" text-anchor="middle" fill="#f8fafc" font-size="10">• Serverless Presto Querying</text>
  <text x="847" y="560" text-anchor="middle" fill="#f8fafc" font-size="10">• Fast columnar scans</text>
  <text x="847" y="580" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">Zero Idle Cost</text>
  <text x="847" y="598" text-anchor="middle" fill="#38bdf8" font-size="9">Open for ODBC Connection</text>

  <!-- Arrow 4 to 5 -->
  <path d="M 955 370 L 975 370" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flow-arrow)"/>

  <!-- STEP 5: POWER BI -->
  <rect x="980" y="110" width="190" height="520" rx="12" fill="url(#p-bi)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="995" y="125" width="160" height="32" rx="6" fill="#075985" />
  <text x="1075" y="146" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">STAGE 5: POWER BI</text>

  <rect x="995" y="175" width="160" height="125" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
  <text x="1075" y="202" text-anchor="middle" fill="#f0f9ff" font-size="12" font-weight="bold">Athena Connection</text>
  <text x="1075" y="225" text-anchor="middle" fill="#bae6fd" font-size="10">Mode: DirectQuery</text>
  <text x="1075" y="245" text-anchor="middle" fill="#bae6fd" font-size="10">or Automated Import</text>
  <text x="1075" y="270" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">Sub-second Refresh</text>

  <rect x="995" y="315" width="160" height="295" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
  <text x="1075" y="340" text-anchor="middle" fill="#f0f9ff" font-size="12" font-weight="bold">Presentation UI</text>
  <line x1="1005" y1="352" x2="1145" y2="352" stroke="#0284c7" stroke-width="1"/>

  <rect x="1005" y="365" width="140" height="40" rx="5" fill="#082f49"/>
  <text x="1075" y="382" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="bold">Returns vs Orders</text>
  <text x="1075" y="396" text-anchor="middle" fill="#7dd3fc" font-size="8">Customer / SKU Bar Chart</text>

  <rect x="1005" y="413" width="140" height="40" rx="5" fill="#082f49"/>
  <text x="1075" y="430" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="bold">Regional Growth</text>
  <text x="1075" y="444" text-anchor="middle" fill="#7dd3fc" font-size="8">Interactive Geo Map</text>

  <rect x="1005" y="461" width="140" height="40" rx="5" fill="#082f49"/>
  <text x="1075" y="478" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="bold">Sales vs Margin</text>
  <text x="1075" y="492" text-anchor="middle" fill="#7dd3fc" font-size="8">Scatter Quad Matrix</text>

  <rect x="1005" y="509" width="140" height="40" rx="5" fill="#082f49"/>
  <text x="1075" y="526" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="bold">Digital Payments %</text>
  <text x="1075" y="540" text-anchor="middle" fill="#7dd3fc" font-size="8">100% Stacked Area Trend</text>

  <rect x="1005" y="557" width="140" height="40" rx="5" fill="#082f49"/>
  <text x="1075" y="574" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="bold">Sales QoQ Growth</text>
  <text x="1075" y="588" text-anchor="middle" fill="#7dd3fc" font-size="8">Quarterly Waterfall Chart</text>
</svg>